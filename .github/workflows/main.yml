name: GraphQL App CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feature/tests
  pull_request:
    branches: 
      - main
      - test

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          
      - name: Install dependencies
        run: npm ci
      
      - name: Run location tests
        if: github.ref == 'refs/heads/feature/tests'
        run: npm test -- --testMatch="**/src/tests/location.test.jsx" --watchAll=false